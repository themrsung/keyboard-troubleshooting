<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Generated by layouts/render/build.py from layouts/render/template.html: edit those, not this. */
:root {
  --bg: #f5f3ef; --text: #2b2a28; --muted: #77726a; --border: #dcd6cd;
  --plate: #3a3735; --cap: #faf8f5; --cap-edge: #c9c1b6; --cap-fn: #e6dfd5; --cap-mod: #d9d2c8;
  --lang: #c79b6c; --lang-text: #2b2a28; --moved: #c79b6c; --undef: #7a8fa6; --undef-edge: #9fb2c6;
  --us: #8a847b; --ko: #2b2a28; --ko-shift: #8e6e53; --kana: #2f6f8f; --kana-shift: #5b8fa8;
  --font: "Noto Sans KR", "Noto Sans JP", "Apple SD Gothic Neo", "Hiragino Sans", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1f1d1c; --text: #ece7e1; --muted: #a59e94; --border: #3d3936;
  --plate: #121110; --cap: #34312e; --cap-edge: #1a1817; --cap-fn: #2b2826; --cap-mod: #282624;
  --lang: #b88a5c; --lang-text: #1f1d1c; --moved: #d2a676; --undef: #4f6377; --undef-edge: #6d8399;
  --us: #8f887e; --ko: #f1ece6; --ko-shift: #d2a676; --kana: #8cc6e0; --kana-shift: #6fa7c0;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #1f1d1c; --text: #ece7e1; --muted: #a59e94; --border: #3d3936;
  --plate: #121110; --cap: #34312e; --cap-edge: #1a1817; --cap-fn: #2b2826; --cap-mod: #282624;
  --lang: #b88a5c; --lang-text: #1f1d1c; --moved: #d2a676; --undef: #4f6377; --undef-edge: #6d8399;
  --us: #8f887e; --ko: #f1ece6; --ko-shift: #d2a676; --kana: #8cc6e0; --kana-shift: #6fa7c0;
  color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--font); }
main { max-width: 1240px; margin: 0 auto; padding: 40px 24px 48px; display: grid; gap: 32px; }
h1 { margin: 0 0 6px; font-size: 1.7rem; letter-spacing: -0.01em; }
h2 { margin: 0 0 12px; font-size: 1.15rem; }
.lede { margin: 0; max-width: 70ch; color: var(--muted); }
.board { overflow-x: auto; }
.plate { position: relative; background: var(--plate); border-radius: calc(var(--u) * 0.2); }
.key { position: absolute; border-radius: calc(var(--u) * 0.1); background: var(--cap);
  box-shadow: inset 0 calc(var(--u) * -0.06) 0 var(--cap-edge); overflow: hidden; }
.key span { position: absolute; line-height: 1; white-space: nowrap; }
.us { left: calc(var(--u) * 0.1); top: calc(var(--u) * 0.08); font: calc(var(--u) * 0.17) var(--mono); color: var(--us); }
.ko { left: calc(var(--u) * 0.1); bottom: calc(var(--u) * 0.14); font-size: calc(var(--u) * 0.3); font-weight: 500; color: var(--ko); }
.ko-s { left: calc(var(--u) * 0.1); bottom: calc(var(--u) * 0.47); font-size: calc(var(--u) * 0.16); color: var(--ko-shift); }
.kana { right: calc(var(--u) * 0.1); bottom: calc(var(--u) * 0.14); font-size: calc(var(--u) * 0.24); color: var(--kana); font-family: "Noto Sans JP", var(--font); }
.kana-s { right: calc(var(--u) * 0.1); bottom: calc(var(--u) * 0.44); font-size: calc(var(--u) * 0.15); color: var(--kana-shift); font-family: "Noto Sans JP", var(--font); }
.label { left: calc(var(--u) * 0.1); bottom: calc(var(--u) * 0.14); font-size: calc(var(--u) * 0.22); font-weight: 500; }
.small { left: calc(var(--u) * 0.1); top: calc(var(--u) * 0.08); font-size: calc(var(--u) * 0.15); color: var(--muted); }
.hold { right: calc(var(--u) * 0.08); top: calc(var(--u) * 0.08); font-size: calc(var(--u) * 0.15); color: var(--lang-text); opacity: 0.75; }
.key.mod, .key.fn, .key.fkey { background: var(--cap-mod); }
.key.mod .label { font-size: calc(var(--u) * 0.17); color: var(--muted); font-weight: 400; }
.key.fn { background: var(--cap-fn); }
.key.fkey .label { font: calc(var(--u) * 0.18) var(--mono); }
.key.fkey .small { color: var(--ko-shift); font-family: var(--font); }
.key.lang, .key.tap { background: var(--lang); }
.key.lang .label { color: var(--lang-text); font-weight: 700; }
.key.lang.narrow .label { font-size: calc(var(--u) * 0.18); }
.key.tap .us, .key.tap .ko, .key.tap .ko-s, .key.tap .kana, .key.tap .kana-s { color: var(--lang-text); }
.key.moved { outline: 2px solid var(--moved); outline-offset: -2px; }
.key.blank { background: transparent; box-shadow: none; outline: 1px dashed var(--border); outline-offset: -1px; }
.key.undef { background: repeating-linear-gradient(135deg, var(--undef) 0 4px, transparent 4px 9px); box-shadow: none;
  outline: 1px dashed var(--undef-edge); outline-offset: -1px; }
.key.half .label, .key.half .ko { font-size: calc(var(--u) * 0.15); bottom: calc(var(--u) * 0.05); }
.key.half .us, .key.half .small { top: calc(var(--u) * 0.04); font-size: calc(var(--u) * 0.12); }
.key.half .kana { font-size: calc(var(--u) * 0.15); bottom: calc(var(--u) * 0.05); }
.key.half .ko-s, .key.half .kana-s { display: none; }
.key.ell .label, .key.ell .small { left: calc(var(--u) * (var(--ell) + 0.1)); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center; color: var(--muted); font-size: 0.85rem; }
.legend .sample { position: relative; width: 64px; height: 64px; --u: 64px; }
.legend .sample .key { left: 0; top: 0; width: 60px; height: 60px; }
.legend dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
.legend dt { font-weight: 600; } .legend dd { margin: 0; }
.swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; }
footer { color: var(--muted); font-size: 0.85rem; border-top: 1px solid var(--border); padding-top: 12px; }
</style>
</head>
<body>
<main id="main"></main>
<script>
const DATA = {{DATA}};

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

/** One key: its position from the geometry, its legends from what it does on this layer. */
function drawKey(k, action) {
  const key = el("div", "key");
  const gap = 0.07;
  Object.assign(key.style, {
    left: `calc(var(--u) * ${k.x + gap / 2 + 0.2})`, top: `calc(var(--u) * ${k.y + gap / 2 + 0.2})`,
    width: `calc(var(--u) * ${k.w - gap})`, height: `calc(var(--u) * ${k.h - gap})`,
  });
  if (k.h < 1) key.classList.add("half");
  if (k.ell) {  // An L-shaped key (JIS Enter): the bottom half starts `ell` units further right.
    const cut = `${(k.ell / (k.w - gap)) * 100}%`;
    key.style.clipPath = `polygon(0 0, 100% 0, 100% 100%, ${cut} 100%, ${cut} 50%, 0 50%)`;
    key.style.setProperty("--ell", k.ell);
    key.classList.add("ell");
  }
  const a = action || { kind: "blank" };
  key.classList.add(a.kind);
  const legends = (code) => {
    const ko = DATA.modeA[code], kana = DATA.kana[code];
    if (ko) { if (ko[1] && ko[1] !== ko[0]) key.append(el("span", "ko-s", ko[1])); key.append(el("span", "ko", ko[0])); }
    if (kana) { if (kana[1]) key.append(el("span", "kana-s", kana[1])); key.append(el("span", "kana", kana[0])); }
  };
  switch (a.kind) {
    case "send":
      key.append(el("span", "us", k.us));
      if (a.code !== k.id) key.classList.add("moved");
      if (a.code === "Backquote") key.append(el("span", "label", "`  ~"));
      legends(a.code);
      break;
    case "tap":
      key.append(el("span", "us", k.us));
      key.append(el("span", "hold", "hold " + a.hold));
      legends(a.code);
      break;
    case "lang":
      if (a.hold) key.append(el("span", "hold", "hold " + a.hold));
      key.append(el("span", "label", a.tap));
      if (a.tap.length > 3 && k.w <= 1) key.classList.add("narrow");
      break;
    case "fn":
      if (a.small) key.append(el("span", "small", a.small));
      key.append(el("span", "label", a.label));
      if (a.moved) key.classList.add("moved");
      break;
    case "fkey":
      if (a.jk) key.append(el("span", "small", a.jk));
      key.append(el("span", "label", a.label));
      if (a.moved) key.classList.add("moved");
      break;
    case "mod":
      key.append(el("span", "label", a.label));
      if (a.moved) key.classList.add("moved");
      break;
  }
  key.title = `${k.us || k.id}`;
  return key;
}

const main = document.getElementById("main");
const header = el("header");
header.append(el("h1", null, DATA.title), el("p", "lede", DATA.lede));
main.append(header);

// The legend: a sample key, and what each colour means.
const legend = el("div", "legend");
const sample = el("div", "sample");
sample.append(drawKey({ id: "KeyQ", us: "Q", x: -0.2, y: -0.2, w: 1.07, h: 1.07 }, { kind: "send", code: "KeyQ" }));
const dl = el("dl");
for (const [term, text] of [
  ["Top left", DATA.capLegend],
  ["Bottom left", "JIS Korean, Mode A (Shift above)"],
  ["Bottom right", "Japanese Kana (Shift above)"],
]) { dl.append(el("dt", null, term), el("dd", null, text)); }
const swatches = el("div");
const swatchList = [["var(--lang)", "language key, or tap (hold shown top right)"], ["transparent; outline: 2px solid var(--moved)", "moved: sends another key"], ["var(--cap-fn)", "function"], ["transparent; outline: 1px dashed var(--muted)", "on a layer: same as the base layer"]];
if (DATA.layers.some((l) => Object.values(l.keys).some((a) => a.kind === "undef")))
  swatchList.push(["repeating-linear-gradient(135deg, var(--undef) 0 3px, transparent 3px 6px); outline: 1px dashed var(--undef-edge)", "undefined: passes through here; free for any implementation"]);
for (const [cls, text] of swatchList) {
  const s = el("span", null);
  const sw = el("span", "swatch"); sw.setAttribute("style", `background: ${cls}`);
  s.append(sw, text); swatches.append(s, el("br"));
}
// A layout without characters (a numpad) has no legends to explain: only the colours.
if (DATA.plain) legend.append(swatches); else legend.append(sample, dl, swatches);
main.append(legend);

const width = Math.max(...DATA.keys.map((k) => k.x + k.w)) + 0.4;
const height = Math.max(...DATA.keys.map((k) => k.y + k.h)) + 0.4;
document.documentElement.style.setProperty("--u", `min(52px, calc((100vw - 56px) / ${width}))`);
for (const layer of DATA.layers) {
  const section = el("section");
  section.append(el("h2", null, layer.name));
  const board = el("div", "board");
  const plate = el("div", "plate");
  plate.style.width = `calc(var(--u) * ${width})`;
  plate.style.height = `calc(var(--u) * ${height})`;
  for (const k of DATA.keys) plate.append(drawKey(k, layer.keys[k.id]));
  board.append(plate);
  section.append(board);
  main.append(section);
}
main.append(el("footer", null, (DATA.plain ? "" : "Mode A legends from JIS Korean's spec §3 (github.com/team-mirae/jis-korean); Kana legends are the JIS kana layout. ") + "Generated by layouts/render/build.py."));
document.documentElement.dataset.height = document.documentElement.scrollHeight;
</script>
</body>
</html>
