<script>
const DATA = {"title": "Numpad for numbers", "lede": "An SPM AL21W as a number input device: the numpad section, with Backspace in place of Num Lock and Esc, =, Tab and Fn1 (play/pause on a tap) on the top row; arrows, modifiers, volume and connection modes on Fn1; the lighting toggle and hardware reset on Fn2.", "keys": [{"id": "TopLeft", "us": "Esc", "x": 0.0, "y": 0.0, "w": 1, "h": 1}, {"id": "TopSecond", "us": "Calc", "x": 1.0, "y": 0.0, "w": 1, "h": 1}, {"id": "TopThird", "us": "BS", "x": 2.0, "y": 0.0, "w": 1, "h": 1}, {"id": "TopRight", "us": "Fn", "x": 3.0, "y": 0.0, "w": 1, "h": 1}, {"id": "NumLock", "us": "Num", "x": 0.0, "y": 1.25, "w": 1, "h": 1}, {"id": "NumpadDivide", "us": "/", "x": 1.0, "y": 1.25, "w": 1, "h": 1}, {"id": "NumpadMultiply", "us": "*", "x": 2.0, "y": 1.25, "w": 1, "h": 1}, {"id": "NumpadSubtract", "us": "-", "x": 3.0, "y": 1.25, "w": 1, "h": 1}, {"id": "Numpad7", "us": "7", "x": 0.0, "y": 2.25, "w": 1, "h": 1}, {"id": "Numpad8", "us": "8", "x": 1.0, "y": 2.25, "w": 1, "h": 1}, {"id": "Numpad9", "us": "9", "x": 2.0, "y": 2.25, "w": 1, "h": 1}, {"id": "NumpadAdd", "us": "+", "x": 3.0, "y": 2.25, "w": 1, "h": 2}, {"id": "Numpad4", "us": "4", "x": 0.0, "y": 3.25, "w": 1, "h": 1}, {"id": "Numpad5", "us": "5", "x": 1.0, "y": 3.25, "w": 1, "h": 1}, {"id": "Numpad6", "us": "6", "x": 2.0, "y": 3.25, "w": 1, "h": 1}, {"id": "Numpad1", "us": "1", "x": 0.0, "y": 4.25, "w": 1, "h": 1}, {"id": "Numpad2", "us": "2", "x": 1.0, "y": 4.25, "w": 1, "h": 1}, {"id": "Numpad3", "us": "3", "x": 2.0, "y": 4.25, "w": 1, "h": 1}, {"id": "NumpadEnter", "us": "Enter", "x": 3.0, "y": 4.25, "w": 1, "h": 2}, {"id": "Numpad0", "us": "0", "x": 0.0, "y": 5.25, "w": 2, "h": 1}, {"id": "NumpadDecimal", "us": ".", "x": 2.0, "y": 5.25, "w": 1, "h": 1}], "capLegend": "the US QWERTY key cap", "plain": true, "layers": [{"name": "Layer 0", "keys": {"NumpadDivide": {"kind": "fn", "label": "/", "small": "", "moved": false}, "NumpadMultiply": {"kind": "fn", "label": "*", "small": el": "←", "small": "", "moved": false}, "Numpad8": {"kind": "fn", "label": "↓", "small": "", "moved": false}, "Numpad9": {"kind": "fn", "label": "→", "small": "", "moved": false}, "NumpadAdd": {"kind": "fn", "label": "Control", "small": "right", "moved": false}, "Numpad4": {"kind": "fn", "label": "⌥", "small": "right", "moved": false}, "Numpad5": {"kind": "fn", "label": "⌘", "small": "right", "moved": false}, "Numpad6": {"kind": "fn", "label": "⇧", "small": "right", "moved": false}, "Numpad1": {"kind": "fn", "label": "BT 1", "small": "", "moved": false}, "Numpad2": {"kind": "fn", "label": "BT 2", "small": "", "moved": false}, "Numpad3": {"kind": "fn", "label": "BT 3", "small": "", "moved": false}, "NumpadEnter": {"kind": "fn", "label": "6KRO", "small": "/ NKRO", "moved": true}, "Numpad0": {"kind": "fn", "label": "USB", "small": "mode", "moved": true}, "NumpadDecimal": {"kind": "fn", "label": "2.4G", "small": "mode", "moved": true}}}, {"name": "Layer 2 (Fn2: hold Fn1, then Tab)", "keys": {"TopLeft": {"kind": "fn", "label": "Light", "small": "on/off", "moved": true}, "TopSecond": {"kind": "lang", "tap": "英数", "hold": ""}, "TopThird": {"kind": "lang", "tap": "Fn2", "hold": ""}, "TopRight": {"kind": "lang", "tap": "Fn1", "hold": ""}, "NumLock": {"kind": "undef"}, "NumpadDivide": {"kind": "undef"}, "NumpadMultiply": {"kind": "mod", "label": "RFU", "moved": false}, "NumpadSubtract": {"kind": "mod", "label": "RFU", "moved": false}, "Numpad7": {"kind": "undef"}, "Numpad8": {"kind": "undef"}, "Numpad9": {"kind": "undef"}, "NumpadAdd": {"kind": "undef"}, "Numpad4": {"kind": "undef"}, "Numpad5": {"kind": "undef"}, "Numpad6": {"kind": "undef"}, "Numpad1": {"kind": "undef"}, "Numpad2": {"kind": "undef"}, "Numpad3": {"kind": "undef"}, "NumpadEnter": {"kind": "undef"}, "Numpad0": {"kind": "fn", "label": "Reset", "small": "hold 3 s", "moved": true}, "NumpadDecimal": {"kind": "undef"}}}], "modeA": {"Digit1": ["ㅃ", "1"], "Digit2": ["ㅉ", "2"], "Digit3": ["ㄸ", "3"], "Digit4": ["ㄲ", "4"], "Digit5": ["ㅆ", "5"], "Digit6": ["ㅟ", "6"], "Digit7": ["ㅝ", "7"], "Digit8": ["ㅚ", "8"], "Digit9": ["ㅢ", "9"], "Digit0": ["ㅘ", "0"], "Minus": ["!", "?"], "Equal": ["(", ")"], "IntlYen": ["—", "^"], "KeyQ": ["ㅂ", "ㅃ"], "KeyW": ["ㅈ", "ㅉ"], "KeyE": ["ㄷ", "ㄸ"], "KeyR": ["ㄱ", "ㄲ"], "KeyT": ["ㅅ", "ㅆ"], "KeyY": ["ㅛ", null], "KeyU": ["ㅕ", null], "KeyI": ["ㅑ", null], "KeyO": ["ㅐ", "ㅒ"], "KeyP": ["ㅔ", "ㅖ"], "BracketLeft": ["'", "\""], "BracketRight": ["[", "「"], "KeyA": ["ㅁ", null], "KeyS": ["ㄴ", null], "KeyD": ["ㅇ", null], "KeyF": ["ㄹ", null], "KeyG": ["ㅎ", null], "KeyH": ["ㅗ", null], "KeyJ": ["ㅓ", null], "KeyK": ["ㅏ", null], "KeyL": ["ㅣ", null], "Semicolon": ["~", "-"], "Quote": [":", ";"], "Backslash": ["]", "」"], "KeyZ": ["ㅋ", "반각"], "KeyX": ["ㅌ", null], "KeyC": ["ㅊ", null], "KeyV": ["ㅍ", null], "KeyB": ["ㅠ", null], "KeyN": ["ㅜ", null], "KeyM": ["ㅡ", null], "Comma": [",", null], "Period": [".", null], "Slash": ["·", null], "IntlRo": ["\\", "_"]}, "kana": {"Digit1": ["ぬ", null], "Digit2": ["ふ", null], "Digit3": ["あ", "ぁ"], "Digit4": ["う", "ぅ"], "Digit5": ["え", "ぇ"], "Digit6": ["お", "ぉ"], "Digit7": ["や", "ゃ"], "Digit8": ["ゆ", "ゅ"], "Digit9": ["よ", "ょ"], "Digit0": ["わ", "を"], "Minus": ["ほ", null], "Equal": ["へ", null], "IntlYen": ["ー", null], "KeyQ": ["た", null], "KeyW": ["て", null], "KeyE": ["い", "ぃ"], "KeyR": ["す", null], "KeyT": ["か", null], "KeyY": ["ん", null], "KeyU": ["な", null], "KeyI": ["に", null], "KeyO": ["ら", null], "KeyP": ["せ", null], "BracketLeft": ["゛", null], "BracketRight": ["゜", "「"], "KeyA": ["ち", null], "KeyS": ["と", null], "KeyD": ["し", null], "KeyF": ["は", null], "KeyG": ["き", null], "KeyH": ["く", null], "KeyJ": ["ま", null], "KeyK": ["の", null], "KeyL": ["り", null], "Semicolon": ["れ", null], "Quote": ["け", null], "Backslash": ["む", "」"], "KeyZ": ["つ", "っ"], "KeyX": ["さ", null], "KeyC": ["そ", null], "KeyV": ["ひ", null], "KeyB": ["こ", null], "KeyN": ["み", null], "KeyM": ["も", null], "Comma": ["ね", "、"], "Period": ["る", "。"], "Slash": ["め", "・"], "IntlRo": ["ろ", null]}, "koLegend": "JIS Korean, Mode A (Shift above)", "kanaLegend": "Japanese Kana (Shift above)", "footer": "Mode A legends from JIS Korean's spec §3 (github.com/team-mirae/jis-korean); Kana legends are the JIS kana layout. "};

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

/** One key: its position from the geometry, its legends from what it does on this layer. */
function drawKey(k, action) {
  const key = el("div", "key");
  const gap = 0.07;
  Object.assign(key.style, {
    left: `calc(var(--u) * ${k.x + gap / 2 + 0.2})`, top: `calc(var(--u) * ${k.y + gap / 2 + 0.2})`,
    width: `calc(var(--u) * ${k.w - gap})`, height: `calc(var(--u) * ${k.h - gap})`,
  });
  if (k.h < 1) key.classList.add("half");
  if (k.ell) {  // An L-shaped key (JIS Enter): the bottom half starts `ell` units further right.
    const cut = `${(k.ell / (k.w - gap)) * 100}%`;
    key.style.clipPath = `polygon(0 0, 100% 0, 100% 100%, ${cut} 100%, ${cut} 50%, 0 50%)`;
    key.style.setProperty("--ell", k.ell);
    key.classList.add("ell");
  }
  const a = action || { kind: "blank" };
  key.classList.add(a.kind);
  const legends = (code) => {
    const ko = DATA.modeA[code], kana = DATA.kana[code];
    if (ko) { if (ko[1] && ko[1] !== ko[0]) key.append(el("span", "ko-s", ko[1])); key.append(el("span", "ko", ko[0])); }
    if (kana) { if (kana[1]) key.append(el("span", "kana-s", kana[1])); key.append(el("span", "kana", kana[0])); }
  };
  switch (a.kind) {
    case "send":
      key.append(el("span", "us", k.us));
      if (a.code !== k.id) key.classList.add("moved");
      if (a.code === "Backquote") key.append(el("span", "label", "`  ~"));
      legends(a.code);
      break;
    case "tap":
      key.append(el("span", "us", k.us));
      key.append(el("span", "hold", "hold " + a.hold));
      legends(a.code);
      break;
    case "lang":
      if (a.hold) key.append(el("span", "hold", "hold " + a.hold));
      key.append(el("span", "label", a.tap));
      if (a.tap.length > 3 && k.w <= 1) key.classList.add("narrow");
      break;
    case "fn":
      if (a.small) key.append(el("span", "small", a.small));
      key.append(el("span", "label", a.label));
      if (a.moved) key.classList.add("moved");
      break;
    case "fkey":
      if (a.jk) key.append(el("span", "small", a.jk));
      key.append(el("span", "label", a.label));
      if (a.moved) key.classList.add("moved");
      break;
    case "mod":
      key.append(el("span", "label", a.label));
      if (a.moved) key.classList.add("moved");
      break;
  }
  key.title = `${k.us || k.id}`;
  return key;
}

const main = document.getElementById("main");
const header = el("header");
header.append(el("h1", null, DATA.title), el("p", "lede", DATA.lede));
main.append(header);

// The legend: a sample key, and what each colour means.
const legend = el("div", "legend");
const sample = el("div", "sample");
sample.append(drawKey({ id: "KeyQ", us: "Q", x: -0.2, y: -0.2, w: 1.07, h: 1.07 }, { kind: "send", code: "KeyQ" }));
const dl = el("dl");
for (const [term, text] of [
  ["Top left", DATA.capLegend],
  ["Bottom left", DATA.koLegend],
  ["Bottom right", DATA.kanaLegend],
]) { dl.append(el("dt", null, term), el("dd", null, text)); }
const swatches = el("div");
const swatchList = [["var(--lang)", "language key, or tap (hold shown top right)"], ["transparent; outline: 2px solid var(--moved)", "moved: sends another key"], ["var(--cap-fn)", "function"], ["transparent; outline: 1px dashed var(--muted)", "on a layer: same as the base layer"]];
if (DATA.layers.some((l) => Object.values(l.keys).some((a) => a.kind === "undef")))
  swatchList.push(["repeating-linear-gradient(135deg, var(--undef) 0 3px, transparent 3px 6px); outline: 1px dashed var(--undef-edge)", "undefined: passes through here; free for any implementation"]);
for (const [cls, text] of swatchList) {
  const s = el("span", null);
  const sw = el("span", "swatch"); sw.setAttribute("style", `background: ${cls}`);
  s.append(sw, text); swatches.append(s, el("br"));
}
// A layout without characters (a numpad) has no legends to explain: only the colours.
if (DATA.plain) legend.append(swatches); else legend.append(sample, dl, swatches);
main.append(legend);

const width = Math.max(...DATA.keys.map((k) => k.x + k.w)) + 0.4;
const height = Math.max(...DATA.keys.map((k) => k.y + k.h)) + 0.4;
document.documentElement.style.setProperty("--u", `min(52px, calc((100vw - 56px) / ${width}))`);
for (const layer of DATA.layers) {
  const section = el("section");
  section.append(el("h2", null, layer.name));
  const board = el("div", "board");
  const plate = el("div", "plate");
  plate.style.width = `calc(var(--u) * ${width})`;
  plate.style.height = `calc(var(--u) * ${height})`;
  for (const k of DATA.keys) plate.append(drawKey(k, layer.keys[k.id]));
  board.append(plate);
  section.append(board);
  main.append(section);
}
